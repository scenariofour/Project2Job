name: Project2Job validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4" "PyYAML>=6"
      - run: make validate
      - run: make test
      - run: make inventory
      - run: git diff --check
