[project]
name = "career-desk"
version = "0.1.0"
description = "Role-backwards project evidence system for early-career AI PM candidates"
requires-python = ">=3.11"

[project.optional-dependencies]
agent = [
  "openai>=1,<3",
  "openai-agents>=0.13,<1"
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]
dev = [
  "pytest>=8,<9",
  "jsonschema>=4,<5"
]
